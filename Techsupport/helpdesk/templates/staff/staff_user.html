{% extends "staff/staffbase.html" %}

{% block content %}

<div class="flex justify-center mt-12 w-10/12">
  <div class="w-3/4">

    <!-- Page Heading -->
    <h2 class="text-3xl font-semibold text-blue-700 text-center mb-8">
      Users handled by you
    </h2>

    <!-- Users Table -->
    <div class="overflow-x-auto">
      <table class="w-full border border-blue-200 rounded-lg shadow-sm text-center">
        <thead class="bg-blue-100 text-gray-700">
          <tr>
            <th class="py-3 px-4 border border-blue-200">Username</th>
            <th class="py-3 px-4 border border-blue-200">Email</th>
          </tr>
        </thead>

        <tbody class="bg-white">
          {% for user in users %}
          <tr class="hover:bg-blue-50 transition">
            <td class="py-3 px-4 border border-blue-200 font-medium">
              {{ user.username }}
            </td>
            <td class="py-3 px-4 border border-blue-200">
              {{ user.email }}
            </td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="2" class="py-6 text-gray-500">
              No users assigned yet
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

  </div>
</div>

{% endblock %}
